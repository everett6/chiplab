# Illustrative 3D-stacked (SoIC hybrid bonding) accelerator: logic die on an SRAM cache die.
design:
  name: "3D-Stacked SRAM Accelerator"
  version: "0.1"
  description: >-
    N3 compute die hybrid-bonded (SoIC) face-to-face on an N5 SRAM die holding 256 MB of
    cache, with 4 HBM3E stacks beside the stack. Large on-package SRAM cuts HBM traffic for
    weights that fit; the stack shares one thermal path, so power density is the risk.
  architecture: "heterogeneous_accelerator"
  package:
    type: "3D_stacking"
    interposer: "soic"
  chiplets:
    - id: "logic"
      type: "compute"
      count: 1
      area_mm2: 400.0
      tdp_watts: 380.0
      process_nm: 3
      compute:
        architecture: "tensor_engine"
        precision: "FP8"
        peak_tops: 1400.0
        clock_ghz: 1.6
        mac_units: 229376
        sram_mb: 288.0          # 32 MB on the logic die + 256 MB on sram_die
        efficiency_factor: 0.7
    - id: "sram_die"          # 256 MB cache die under the logic die; no compute of its own
      type: "io"
      count: 1
      area_mm2: 400.0
      tdp_watts: 25.0
      process_nm: 5
    - id: "hbm"
      type: "HBM3E"
      count: 4
      tdp_watts: 15.0
      memory:
        technology: "HBM3E"
        capacity_per_chiplet_gb: 24.0
        channels: 16
        bandwidth_per_channel_gbps: 75.0
        latency_ns: 100.0
        energy_pj_per_bit: 3.5
        stack_layers: 8
  interconnect:
    topology: "mesh"
    link_bandwidth_gbps: 12000.0      # hybrid-bond vertical links are dense and short
    latency_ns: 5.0
    energy_pj_per_bit: 0.05
    lanes_per_chiplet: 8
  constraints:
    max_power_watts: 600.0
    max_temp_c: 95.0
    thermal_resistance_c_per_w: 0.08
    max_cost_usd: 7000.0
  metadata:
    suggested_volume: 50000
    workload_hint: {type: "llm_decode", model_params_b: 13, batch_size: 8}
