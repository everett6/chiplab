design:
  name: "Transformer Accelerator"
  version: "1.0"
  parent_version: null
  description: "HBM + systolic array tensor engine architecture for transformer inference. Demonstrates ChipLab is generic and not tied to ECHO designs."

  architecture: "heterogeneous_accelerator"

  chiplets:
    - id: "hbm_0"
      type: "HBM3"
      count: 2
      area_mm2: 300.0
      tdp_watts: 40.0
      process_nm: 12
      memory:
        technology: "HBM3"
        capacity_per_chiplet_gb: 16.0
        channels: 8
        bandwidth_per_channel_gbps: 256.0
        latency_ns: 30.0
        energy_pj_per_bit: 32.0
        stack_layers: 8
      compute:
        architecture: "tensor_engine"
        precision: "BF16"
        peak_tops: 1000.0
        clock_ghz: 1.2
        mac_units: 8192
        sram_mb: 64.0
        efficiency_factor: 0.85
    - id: "systolic_0"
      type: "systolic_array"
      count: 4
      area_mm2: 500.0
      tdp_watts: 50.0
      process_nm: 7
      compute:
        architecture: "systolic"
        precision: "INT8"
        peak_tops: 500.0
        clock_ghz: 1.5
        mac_units: 4096
        efficiency_factor: 0.9
    - id: "vector_0"
      type: "vector_processor"
      count: 1
      area_mm2: 200.0
      tdp_watts: 15.0
      process_nm: 16
      compute:
        architecture: "vector"
        precision: "FP16"
        peak_tops: 200.0
        clock_ghz: 2.0
        mac_units: 256
        sram_mb: 16.0
        efficiency_factor: 0.7

  interconnect:
    topology: "crossbar"
    link_bandwidth_gbps: 200.0
    latency_ns: 5.0
    energy_pj_per_bit: 3.0
    lanes_per_chiplet: 64

  constraints:
    max_power_watts: 105.0
    max_area_mm2: 1200.0
    max_temp_c: 90.0
    ambient_temp_c: 25.0
    max_cost_usd: 800000000.0

  metadata:
    target_workload: "transformer_inference"
    target_application: "large_language_model_inference"

  workload:
    name: "transformer_inference_workload"
    type: "transformer_decode"
    batch_size: 1
    sequence_length: 512
    hidden_dim: 8192
    num_layers: 48
    num_experts: 16
    active_experts: 8
    precision: "BF16"