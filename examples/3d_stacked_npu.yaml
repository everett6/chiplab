# 3D-stacked NPU with 3D memory and compute chiplets.
# Every number is an estimate for exploration, not a product.
design:
  name: "3D-Stacked NPU"
  version: "0.1"
  description: >-
    3D-stacked hybrid-bonded NPU with logic die on SRAM cache die,
    plus 4 HBM3E stacks beside the stack. 3D memory and compute chiplets
    share one thermal path; power density is the primary risk.
  architecture: "heterogeneous_accelerator"
  package:
    type: "3D_stacking"
    interposer: "soic"
  chiplets:
    - id: "logic0"
      type: "compute"
      count: 1
      area_mm2: 500.0
      tdp_watts: 400.0
      process_nm: 3
      compute:
        architecture: "tensor_engine"
        precision: "BF16"
        peak_tops: 1600.0
        clock_ghz: 1.5
        mac_units: 327680
        sram_mb: 512.0
        efficiency_factor: 0.75
      provenance: "published"
    - id: "sram_die0"
      type: "io"
      count: 1
      area_mm2: 500.0
      tdp_watts: 30.0
      process_nm: 5
      memory:
        technology: "SRAM"
        capacity_per_chiplet_gb: 512.0
        channels: 1
        bandwidth_per_channel_gbps: 500.0
        latency_ns: 1.0
        energy_pj_per_bit: 0.2
      provenance: "published"
    - id: "hbm0"
      type: "memory"
      count: 4
      area_mm2: 80.0
      tdp_watts: 20.0
      memory:
        technology: "HBM3E"
        capacity_per_chiplet_gb: 32.0
        channels: 16
        bandwidth_per_channel_gbps: 100.0
        latency_ns: 80.0
        energy_pj_per_bit: 3.0
        stack_layers: 8
      provenance: "published"
  interconnect:
    topology: "mesh"
    link_bandwidth_gbps: 15000.0
    latency_ns: 3.0
    energy_pj_per_bit: 0.05
    lanes_per_chiplet: 16
  constraints:
    max_power_watts: 650.0
    max_temp_c: 95.0
    thermal_resistance_c_per_w: 0.08
    max_cost_usd: 10000.0
  metadata:
    suggested_volume: 50000
    workload_hint: {type: "llm_decode", model_params_b: 13, batch_size: 8}
  provenance: "published"