design:
  name: "Echo Chiplet v0.1"
  version: "0.1"
  parent_version: null
  description: "Heterogeneous DRAM-PIM + digital compute chiplet design for MoE decode. Baseline version with measured DRAM and estimated PIM parameters."

  architecture: "heterogeneous_accelerator"

  chiplets:
    - id: "mem_0"
      type: "DRAM"
      count: 4
      area_mm2: 350.0
      tdp_watts: 15.0
      process_nm: 14
      memory:
        technology: "DRAM"
        capacity_per_chiplet_gb: 8.0
        channels: 8
        banks_per_channel: 8
        bandwidth_per_channel_gbps: 64.0
        latency_ns: 50.0
        energy_pj_per_bit: 64.0
        stack_layers: 1
      compute:
        architecture: "SIMD"
        precision: "INT8"
        peak_tops: 100.0
        clock_ghz: 1.0
        mac_units: 64
        efficiency_factor: 0.8
    - id: "pim_0"
      type: "PIM"
      count: 2
      area_mm2: 250.0
      tdp_watts: 25.0
      process_nm: 28
      memory:
        technology: "processing_in_memory"
        capacity_per_chiplet_gb: 0.0
      compute:
        architecture: "processing_in_memory"
        precision: "INT8"
        peak_tops: 50.0
        clock_ghz: 0.8
        mac_units: 128
        efficiency_factor: 0.95
    - id: "simd_0"
      type: "SIMD"
      count: 1
      area_mm2: 150.0
      tdp_watts: 10.0
      process_nm: 16
      compute:
        architecture: "simd"
        precision: "INT8"
        peak_tops: 100.0
        clock_ghz: 1.0
        mac_units: 64
        sram_mb: 2.0
        efficiency_factor: 0.8

  interconnect:
    topology: "mesh"
    link_bandwidth_gbps: 100.0
    latency_ns: 10.0
    energy_pj_per_bit: 2.0
    lanes_per_chiplet: 4

  constraints:
    max_power_watts: 50.0
    max_area_mm2: 800.0
    max_temp_c: 85.0
    ambient_temp_c: 25.0
    max_cost_usd: 500000000.0

  metadata:
    target_workload: "moe_decode"
    target_application: "large_language_model"

  workload:
    name: "moe_decode_workload"
    type: "moe_decode"
    batch_size: 1
    sequence_length: 128
    hidden_dim: 4096
    num_layers: 32
    num_experts: 8
    active_experts: 2
    precision: "INT8"